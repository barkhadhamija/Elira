name: elira
description: "ELIRA — trauma-informed digital testimony recording app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.0.0
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.3
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  local_auth: ^2.1.8
  camera: ^0.11.0
  path_provider: ^2.1.5
  path: ^1.9.1
  video_player: ^2.8.3
  geolocator: ^11.0.0
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
